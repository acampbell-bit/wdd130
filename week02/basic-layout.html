<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Alisa Campbell">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="basic-logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.churchofjesuschrist.org/?lang=eng">The Church</a></li>
            <li><a href="https://scriptures.byu.edu">BYU-Provo</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum, sit amet consectetur adipisicing elit. Temporibus, quas!</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Vero, repellat.</p>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/campinas-brazil/400x250/campinas-brazil-temple-lds-930766-wallpaper.jpg"
          alt="temple" width="200">
    </aside>
    <footer>
        <p> 🍄‍🟫 Alisa Campbell 🍄‍🟫 </p>
    </footer>
</body>

</html>
