<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information></title>
    <meta name="description" content="email | phone number | fax number | shipping adress">
    <meta name="author" content="Alisa Campbell">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">
    <header class="header">
        <img src="images/z-boat-splash.png" alt="Rafting Logo">
        <nav>
            <ul class="links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Whitewater Adventures Company</h1>
        <address>
            123 Main River Street<br>
            Kolob, California<br>
            +9 999 999 9999<br>
            info@whitewater.com
        </address>
        <section class="map-form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6227.342668752822!2d-122.3758092713709!3d38.70239324986062!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1791265893031!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <fieldset>
                    <legend>Contact Information</legend>

                    <div class="name">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" required>


                        <label for="e-mail">Email</label>
                        <input type="email" name="email" id="e-mail" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label><input type="radio" name="purpose" value="reservation">Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion">Website
                            Suggestion</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Message</legend>
                    <div class="message">
                        <label for="message"></label>
                        <textarea name="message" id="message" rows="4"></textarea>
                    </div>
                </fieldset>

                <div>
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" name="checkbox" id="newsletter">
                </div>

                <button type="submit">Get in Touch!</button>
            </form>

            <section class="contact-adventure">
                <figure class="contact-figure">
                    <img src="images/rose.jpg" alt="Senior Rose Campbell">
                    <figcaption>Senior Guide: Rose Campbell</figcaption>
                </figure>

                <figure class="contact-figure">
                    <img src="images/employee.jpg" alt="Joseph Campbell">
                    <figcaption>Level II: Mark Campbell</figcaption>
                </figure>

                <figure class="contact-figure">
                    <img src="images/ben.jpg" alt="Ben Campbell">
                    <figcaption>Manager: Ben Campbell</figcaption>
                </figure>

            </section>

    </main>
    <footer>
        <p>©️ 2026 | Whitewater Adventures | Alisa Campbell</p>
        <nav class=" socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
